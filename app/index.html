<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uncle Gray's Cartoon Box</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Floating bubble background (Wii U style) -->
  <div id="bubbles"></div>

  <!-- Top status bar (Wii U style) -->
  <header id="status-bar">
    <div class="status-left">
      <span id="greeting"></span>
    </div>
    <div class="status-right">
      <span id="clock"></span>
    </div>
  </header>

  <!-- Profile tile (top-left, Wii U style) -->
  <div id="profile-container">
    <div id="profile-tile">
      <img id="profile-photo" src="../assets/profile.jpg" alt="Profile" draggable="false" onerror="this.style.display='none';document.getElementById('profile-placeholder').style.display='flex'">
      <div id="profile-placeholder">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="4" fill="rgba(100,130,140,0.7)"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="rgba(100,130,140,0.7)" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
    </div>
    <div id="profile-speech-bubble">it's me, uncle Gray!</div>
  </div>

  <!-- Main tile grid -->
  <main id="tile-grid"></main>

  <!-- Video playback overlay — solid black, shown while mpv is running -->
  <div id="video-overlay" class="hidden"></div>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <p>Loading episode...</p>
  </div>

  <!-- Settings tile overlay (placeholder for future) -->
  <div id="settings-overlay" class="hidden">
    <div class="settings-panel">
      <h2>Settings</h2>
      <p>Coming soon...</p>
      <button id="settings-close">Back</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
