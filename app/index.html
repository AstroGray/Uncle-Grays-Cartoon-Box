<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uncle Gray's Cartoon Box</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Floating bubble background (Wii U style) -->
  <div id="bubbles"></div>

  <!-- Top status bar (Wii U style) -->
  <header id="status-bar">
    <div class="status-left">
      <span id="greeting"></span>
    </div>
    <div class="status-right">
      <span id="clock"></span>
    </div>
  </header>

  <!-- Main tile grid -->
  <main id="tile-grid"></main>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <p>Loading episode...</p>
  </div>

  <!-- Settings tile overlay (placeholder for future) -->
  <div id="settings-overlay" class="hidden">
    <div class="settings-panel">
      <h2>Settings</h2>
      <p>Coming soon...</p>
      <button id="settings-close">Back</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
